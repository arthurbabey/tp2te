[project]
name = "tp2te"
version = "0.1.0"
description = "Personalised paper quizzes from student lab notebooks"
requires-python = ">=3.11"
dependencies = [
    "nbformat>=5.9",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
tp2te = "tp2te.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp2te"]

[tool.pytest.ini_options]
testpaths = ["tests"]
